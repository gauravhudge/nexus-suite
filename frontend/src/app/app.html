<main style="max-width: 600px; margin: 2rem auto; font-family: sans-serif;">
  <h1>Nexus Suite</h1>
  <h2>Organizations</h2>

  @if (error()) {
    <p style="color: red;">{{ error() }}</p>
  }

  <input #nameInput placeholder="Organization name" />
  <button (click)="add(nameInput.value); nameInput.value = ''">Add</button>

  <ul>
    @for (o of organizations(); track o.id) {
      <li>{{ o.id }} – {{ o.name }}</li>
    }
  </ul>
</main>
